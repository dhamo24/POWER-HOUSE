<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power House Waffles – Menu</title><meta name="theme-color" content="#0b1f10">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1f10;--y:#f5c542;--lime:#b7d63e}
*{box-sizing:border-box}
body{margin:0;font:17px/1.4 Nunito,system-ui,sans-serif;color:#eaf5df;background:var(--bg);
background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:30px 30px}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;margin:0}button{font:inherit;color:inherit;cursor:pointer}
.top{text-align:center;padding:22px 16px 6px}.logo{width:64px;height:64px;filter:drop-shadow(0 0 14px #f5c542)}
h1{font-weight:700;font-size:clamp(2.2rem,9vw,3.6rem);line-height:1;color:#fff;text-shadow:0 0 5px #fff,0 0 20px var(--y),0 0 44px #f5c542aa}
.tag{margin:6px 0 0;color:#b9d2a6}
/* the shop: the cart photo slides in left to right, then sways */
.stage{overflow:hidden;padding:14px 0 10px}
.cart{position:relative;width:min(780px,96vw);aspect-ratio:1448/1086;margin:0 auto;animation:slide 1.8s cubic-bezier(.2,.8,.2,1) backwards,sway 6s ease-in-out 1.8s infinite}
.cart img{display:block;width:100%;height:auto;filter:drop-shadow(0 0 26px #f5c54266)}
@keyframes slide{from{transform:translateX(-115vw)}}@keyframes sway{50%{transform:translateX(14px)}}
.hs{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:2px;padding:10px 14px;border-radius:22px;background:var(--c);border:3px solid #fff;color:#14301a;z-index:2;
box-shadow:0 0 22px var(--c),0 4px 14px #000a;transition:transform .2s,box-shadow .2s;animation:pop .5s ease-out backwards;animation-delay:calc(1.4s + var(--i)*.15s)}
.hs span{font-size:2rem;line-height:1}.hs b{font:700 .9rem Fredoka,sans-serif;color:#14301a;white-space:nowrap}
.hs::after{content:"";position:absolute;inset:-6px;border-radius:27px;border:2px solid var(--c);opacity:0;animation:ring 2s ease-out infinite}
.hs:hover,.hs:focus-visible{transform:translate(-50%,-50%) scale(1.14);box-shadow:0 0 36px var(--c);outline:0}
.hs.big{padding:14px 22px}.hs.big span{font-size:3rem}.hs.big b{font-size:1.1rem}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}@keyframes ring{0%{opacity:.8;transform:scale(.95)}100%{opacity:0;transform:scale(1.3)}}
.hint{text-align:center;color:var(--y);font:600 1.05rem Fredoka,sans-serif;margin:8px 16px}
main{max-width:700px;margin:auto;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}.chips button{background:none;border:2px solid var(--lime);color:var(--lime);font:700 1rem Nunito,sans-serif;border-radius:99px;padding:8px 18px;cursor:pointer;transition:.2s}.chips button:hover{background:var(--lime);color:#14301a;transform:scale(1.08)}.chips button:active{transform:scale(.95)}
.qt{flex:none;display:flex;align-items:center;gap:7px}.qt button{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);color:#14301a;font:700 1.3rem/1 Fredoka,sans-serif;transition:transform .15s}.qt button:hover{transform:scale(1.15)}.qt button:active{transform:scale(.88)}.qt span{min-width:20px;text-align:center;font:600 1.1rem Fredoka,sans-serif}.ic:hover .qt button{background:#14301a;color:#fff}
.pk{border:0;cursor:pointer;font-weight:600}
body.hb footer{padding-bottom:120px}
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:60;max-width:94vw;border:0;border-radius:99px;padding:13px 22px;background:var(--y);color:#14301a;font:600 1.1rem Fredoka,sans-serif;box-shadow:0 8px 24px #000a,0 0 0 3px #fff;animation:up .4s ease-out;cursor:pointer;white-space:nowrap}.bar u{margin-left:6px}.bar:hover{transform:translateX(-50%) scale(1.05)}@keyframes up{from{opacity:0;transform:translate(-50%,40px)}}
.cr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2d5e38}.cr span{flex:1;font-weight:700}.cr b{font:600 1.1rem Fredoka,sans-serif;min-width:54px;text-align:right}.em0{color:#9db88a;text-align:center;padding:18px 0}
.ty{display:flex;gap:10px;margin:14px 0}.ty label{flex:1;position:relative}.ty input{position:absolute;opacity:0}.ty span{display:block;text-align:center;border:2px solid #2d5e38;border-radius:14px;padding:10px 6px;font-weight:700;cursor:pointer;transition:.2s}.ty input:checked+span{background:var(--y);color:#14301a;border-color:var(--y)}.ty input:focus-visible+span{outline:3px solid var(--y);outline-offset:2px}
.fm{display:grid;gap:10px}.fm input,.fm textarea{width:100%;padding:11px 14px;border-radius:14px;border:2px solid #2d5e38;background:#12301a;color:#fff;font:inherit}.fm input:focus,.fm textarea:focus{outline:0;border-color:var(--y)}.err{color:#ff8a80;font-weight:700;margin:0;min-height:1.2em}
.ct{margin-top:8px}.ct div{display:flex;justify-content:space-between;padding:4px 0}.ct .gt{font:600 1.35rem Fredoka,sans-serif;color:var(--y);border-top:2px dashed #2d5e38;margin-top:6px;padding-top:8px}
.ab{display:flex;gap:8px;flex-wrap:wrap}.go,.upi{border:0;border-radius:99px;padding:11px 20px;font:600 1.05rem Fredoka,sans-serif;cursor:pointer;transition:transform .2s}.go{background:#25a244;color:#fff}.upi{background:#fff;color:#14301a}.go:hover,.upi:hover{transform:translateY(-3px)}.go:disabled,.upi:disabled{opacity:.4;cursor:not-allowed}.clr{background:none;border:0;color:#9db88a;text-decoration:underline;cursor:pointer}
.pr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pr em{margin-top:0!important}
.lk{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:99px;padding:2px 11px;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit;font:600 .95rem Fredoka,sans-serif;cursor:pointer;transition:transform .15s,background .2s}.lk:hover{transform:scale(1.1)}.lk:active{transform:scale(.9)}
.lk.on{background:#ff5b7240}.lk.on span{color:#ff5b72}.lk.pop span{display:inline-block;animation:beat .45s}
.bigb{display:block;text-align:center;text-decoration:none;font-size:1.2rem;padding:15px;margin:14px 0 10px}.cpb{width:100%}.sm{line-height:1.5;margin:6px 0}.sub2{color:#9db88a;font-size:.9rem}.sum{white-space:pre-wrap;background:#12301a;border:2px dashed #2d5e38;border-radius:14px;padding:12px 14px;font-size:.92rem;margin-top:12px;color:#cfe0c4;word-break:break-word}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}.p{position:absolute;top:-30px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(112vh) rotate(var(--r))}}
.p.w,.p.d{width:13px;height:16px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%}.p.w{background:#fffaf0;box-shadow:inset -2px -2px 0 #e2d6b8}.p.d{background:#3b2218;box-shadow:inset -2px -2px 0 #1f110a}.p.spr{width:5px;height:16px;border-radius:3px}
.btn{display:inline-block;text-decoration:none;font:600 1.05rem Fredoka,sans-serif;border-radius:99px;padding:11px 24px;background:var(--y);color:#14301a;margin:4px;transition:transform .2s,box-shadow .2s}
.btn.o{background:transparent;color:#fff;border:2px solid #fff}.btn:hover{transform:translateY(-4px) scale(1.05);box-shadow:0 8px 20px -4px var(--y)}
footer{text-align:center;padding:30px 16px 40px;border-top:4px solid var(--y);background:#08170c;margin-top:30px}footer h3{font-size:1.5rem;color:var(--y);margin-bottom:10px}
/* lists */
dialog{border:0;padding:0;border-radius:26px;width:min(640px,94vw);max-height:88vh;background:#0f2a17;color:#eaf5df;box-shadow:0 0 0 3px var(--c),0 0 50px -5px var(--c),0 24px 60px #000a;overflow:hidden}
dialog[open]{display:flex;flex-direction:column;animation:slideR .4s ease-out}@keyframes slideR{from{opacity:0;transform:translateX(-60px)}}
dialog::backdrop{background:#000c;backdrop-filter:blur(3px)}
.dh,.df{flex:none}
.dh{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#14301a));color:#14301a;padding:18px 20px}
.dh .big{font-size:3rem;display:inline-block;animation:bob 2.5s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px) rotate(8deg)}}
.dh h3{font-size:1.9rem;line-height:1.1}.dh p{margin:2px 0 0;font-weight:700;opacity:.8}
.dh i{position:absolute;font-style:normal;font-size:1.6rem;opacity:.35;animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translateY(-14px) rotate(15deg)}}
.x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:#14301a;color:#fff;transition:transform .2s}.x:hover{transform:rotate(90deg) scale(1.1)}
.pb{overflow:auto;padding:4px 16px 14px}
.gh{display:inline-block;margin:18px 0 8px;background:var(--c);color:#14301a;font:600 1.05rem Fredoka,sans-serif;border-radius:99px;padding:3px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ic{display:flex;align-items:center;gap:12px;background:#17381f;border:2px solid #2d5e38;border-radius:18px;padding:10px 12px;transition:transform .2s,border-color .2s,box-shadow .2s,background .25s,color .25s;animation:slideR .45s ease-out backwards;animation-delay:var(--d)}
.ic.on{border-color:var(--c);background:#1d4528}
.ic:hover{transform:translateY(-4px) scale(1.03);border-color:var(--gl,var(--c));box-shadow:0 12px 26px -6px var(--gl,var(--c));background:var(--h,#1d4528);color:var(--ht,#fff)}
.ie{flex:none;width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,#0f2a17);display:grid;place-items:center;font-size:1.5rem;transition:transform .3s,background .25s}.ic:hover .ie{transform:rotate(-12deg) scale(1.15);background:#ffffff59}
.ic div{flex:1;line-height:1.2}.ic b{display:block;font-weight:700}.ic em{display:inline-block;margin-top:3px;font:600 1.1rem Fredoka,sans-serif;font-style:normal;background:#14301a;color:var(--c);border-radius:99px;padding:0 11px;transition:color .25s}.ic:hover em{color:#fff}
.hr{flex:none;border:0;background:none;font-size:1.5rem;line-height:1;transition:transform .2s}.hr:hover{transform:scale(1.3)}.hr[aria-pressed=true]{animation:beat .4s}@keyframes beat{50%{transform:scale(1.5)}}
.df{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:#08170c;border-top:2px solid color-mix(in srgb,var(--c) 50%,transparent);font-weight:700}
.pk{background:var(--c);color:#14301a;border-radius:99px;padding:3px 14px;font-family:Fredoka,sans-serif}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
@media(max-width:480px){body{font-size:16px}.hs b{white-space:normal;text-align:center;line-height:1.05;max-width:58px}.hs{padding:5px 6px;border-width:2px;border-radius:16px}.hs span{font-size:1.3rem}.hs b{font-size:.66rem}.hs.big{padding:7px 10px}.hs.big span{font-size:1.9rem}.hs.big b{font-size:.78rem}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const chg=(k,d)=>{const q=(cart.get(k)||0)+d;q>0?cart.set(k,q):cart.delete(k);refresh()};
const SB=SHOP.sb,live=!!(SB.url&&SB.key),busy=new Set();
const dev=(()=>{try{let d=localStorage.ph_dev;if(!d){d=((crypto.randomUUID&&crypto.randomUUID())||Date.now()+""+Math.random()).replace(/[^a-z0-9]/gi,"");localStorage.ph_dev=d}return d}catch(_){return "tmp"+Math.random().toString(36).slice(2)+"00000000"}})();
let liked=new Set(),counts={};
try{JSON.parse(localStorage.ph_likes||"[]").forEach(k=>{if(ALL[k])liked.add(k)})}catch(_){}
if(!live)liked.forEach(k=>counts[k]=1);
const saveL=()=>{try{localStorage.ph_likes=JSON.stringify([...liked])}catch(_){}};
const rpc=(fn,b)=>fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:"POST",headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json"},body:JSON.stringify(b||{})}).then(r=>{if(!r.ok)throw 0;return r.json()});
const loadLikes=async()=>{if(!live)return;try{const[c,m]=await Promise.all([rpc("like_counts"),rpc("my_likes",{p_device:dev})]);counts={};c.forEach(r=>counts[r.item]=+r.n);liked=new Set(m.filter(k=>ALL[k]));saveL();refresh()}catch(_){}};
const like=async k=>{if(busy.has(k))return;busy.add(k);const on=!liked.has(k),adj=d=>{on==d?liked.add(k):liked.delete(k);counts[k]=Math.max(0,(counts[k]||0)+(on==d?1:-1));saveL();refresh()};
 adj(true);document.querySelectorAll(`#dlg .lk[data-l="${CSS.escape(k)}"]`).forEach(x=>{x.classList.remove("pop");void x.offsetWidth;x.classList.add("pop")});
 if(live){try{await rpc("toggle_like",{p_item:k,p_device:dev});loadLikes()}catch(_){adj(false)}}
 busy.delete(k)};
const openList=i=>{const g=G[i],d=$("#dlg");let n=0;d.style.setProperty("--c",g.c);
 d.innerHTML=`<div class="dh"><span class="big">${g.e}</span><h3 id="dt">${e(g.t)}</h3><p>${g.tag}</p><i style="right:70px;top:12px">${g.e}</i><i style="right:24px;bottom:8px;animation-delay:1s">✨</i><button class="x" aria-label="Close" data-x>✕</button></div><div class="pb">${g.g.map(([h2,a,gc])=>`<section style="--c:${gc||g.c}">`+(h2?`<span class="gh">${e(h2)}</span>`:"")+`<div class="grid">${a.map(([x,p])=>`<div class="ic${cart.has(x)?" on":""}" data-k="${e(x)}" style="--d:${(n++)*50}ms;${fc(x)}"><span class="ie">${ic(x)}</span><div><b>${e(x)}</b><span class="pr"><em>₹${p}</em><button class="lk" data-l="${e(x)}" aria-label="Like ${e(x)}"></button></span></div><div class="qt" data-k="${e(x)}">${qtH(x)}</div></div>`).join("")}</div></section>`).join("")}</div><div class="df"><span>📦 ₹${SHOP.parcel} extra for parcel</span><button class="pk" id="pk" data-co hidden></button></div>`;
 d.showModal();refresh();loadLikes()};
const openCo=()=>{const d=$("#co");d.style.setProperty("--c","#f5c542");
 d.innerHTML=`<div class="dh"><span class="big">🛒</span><h3 id="ct">Your order</h3><p>Check your items, then send it to the shop</p><button class="x" aria-label="Close" data-x>✕</button></div><div class="pb"><div id="coItems"></div><div class="ty"><label><input type="radio" name="ty" value="e" checked><span>🍽️ Eat here</span></label><label><input type="radio" name="ty" value="p"><span>📦 Parcel +₹${SHOP.parcel}</span></label></div><div class="fm"><input id="cn" placeholder="Your name" autocomplete="name" aria-label="Your name"><input id="cp" type="tel" placeholder="${AUTO?"Phone number (so we can confirm)":"Phone number (optional)"}" autocomplete="tel" aria-label="Phone number"><textarea id="cm" rows="2" placeholder="Any note? (e.g. extra chips)" aria-label="Note"></textarea><p id="ce" class="err" role="alert"></p></div><div id="coTot" class="ct"></div></div><div class="df"><button class="clr" data-clr>Clear</button><div class="ab"><button class="go" id="wa" data-send>Order on WhatsApp</button>${SHOP.upi?'<button class="upi" id="upi" data-upi>Pay with UPI</button>':""}</div></div>`;
 d.showModal();if(lastForm){$("#cn").value=lastForm.n;$("#cp").value=lastForm.ph;$("#cm").value=lastForm.nt;if(lastForm.pc)$("#co input[value=p]").checked=true}coRender()};
const info=()=>{const n=$("#cn").value.trim();if(!n){$("#ce").textContent="Please enter your name";$("#cn").focus();return null}if(AUTO&&$("#cp").value.replace(/\D/g,"").slice(-10).length!=10){$("#ce").textContent="Please enter your 10-digit phone number so we can confirm";$("#cp").focus();return null}$("#ce").textContent="";const pc=parcel();return{n,pc,T:tot()[1]+(pc?SHOP.parcel:0)}};
let lastForm=null,lastMsg="",sentKey="",sentNo="",placed="";
const sentView=(msg,id)=>{const url=`https://wa.me/${SHOP.wa}?text=${encodeURIComponent(msg)}`;lastMsg=msg;
 $("#co").innerHTML=`<div class="dh"><span class="big">✅</span><h3 id="ct">Order ready!</h3><p>Order ${id} · one last step</p><button class="x" aria-label="Close" data-x>✕</button></div><div class="pb"><p class="sm">Tap the green button to send your order to <b>${e(SHOP.name)}</b> on WhatsApp, then press <b>Send</b> in WhatsApp. The shop will reply to confirm.</p><a class="go bigb" href="${url}" target="_blank" rel="noopener">Open WhatsApp</a><button class="upi cpb" data-copy>Copy order text</button><p class="sm sub2">If WhatsApp doesn't open, copy the order and send it to +${SHOP.wa.replace(/^91(\d{5})(\d{5})$/,"91 $1 $2")}.</p><div class="sum" id="sum"></div></div><div class="df"><button class="clr" data-back>← Edit order</button><button class="clr" data-new>Start a new order</button></div>`;
 $("#sum").textContent=msg};
const dayIN=()=>new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});
const nowIN=()=>new Date().toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"2-digit",month:"short",hour:"numeric",minute:"2-digit",hour12:true});
const orderNo=()=>"#"+new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Kolkata",hourCycle:"h23"}).replace(/:/g,"");
const push=async msg=>{const N=SHOP.notify,jobs=[];
 if(N.tgToken&&N.tgChat)jobs.push(fetch(`https://api.telegram.org/bot${N.tgToken}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:N.tgChat,text:msg.replace(/\*/g,"")})}).then(r=>{if(!r.ok)throw 0}));
 if(N.cmbPhone&&N.cmbKey)jobs.push(fetch(`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(N.cmbPhone)}&text=${encodeURIComponent(msg)}&apikey=${encodeURIComponent(N.cmbKey)}`,{mode:"no-cors"}));
 const r=await Promise.allSettled(jobs);if(!r.some(x=>x.status=="fulfilled"))throw 0};
const placedView=(msg,id,ph)=>{lastMsg=msg;$("#co").innerHTML=`<div class="dh"><span class="big">✅</span><h3 id="ct">Order placed!</h3><p>Order ${id}</p><button class="x" aria-label="Close" data-x>✕</button></div><div class="pb"><p class="sm">Thank you! Your order has been sent to <b>${e(SHOP.name)}</b>. We will contact you on <b>${e(ph)}</b> to confirm it.</p><div class="sum" id="sum"></div></div><div class="df"><span></span><button class="clr" data-new>Start a new order</button></div>`;$("#sum").textContent=msg;cart.clear();lastForm=null;refresh()};
const send=async()=>{const i=info();if(!i)return;const ph=$("#cp").value.trim(),nt=$("#cm").value.trim(),key=JSON.stringify([[...cart],i.n,ph,nt,i.pc,dayIN()]);
 const id=(sentKey==key&&sentNo)?sentNo:orderNo();sentKey=key;sentNo=id;lastForm={n:i.n,ph,nt,pc:i.pc};
 const msg=`*New order ${id} - ${SHOP.name}*\n${nowIN()}\nName: ${i.n}${ph?"\nPhone: "+ph:""}\nType: ${i.pc?"Parcel (+₹"+SHOP.parcel+")":"Eat here"}\n\n`+[...cart].map(([k,q])=>`${q} x ${k} = ₹${q*ALL[k]}`).join("\n")+`\n\n*Total: ₹${i.T}*`+(nt?"\nNote: "+nt:"");
 if(!AUTO){sentView(msg,id);return}
 if(placed==key){placedView(msg,id,ph);return}
 const b=$("#wa");b.disabled=true;b.textContent="Sending your order…";
 try{await push(msg);placed=key;if($("#co").open)placedView(msg,id,ph)}
 catch(_){if(!$("#co").open||!$("#wa"))return;$("#wa").disabled=false;$("#wa").textContent="Try again";$("#ce").innerHTML=`Could not send your order. Check your internet and try again, or <a href="https://wa.me/${SHOP.wa}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" style="color:#f5c542">send it on WhatsApp</a>.`}};
const copyMsg=async b=>{try{await navigator.clipboard.writeText(lastMsg)}catch(_){const t=document.createElement("textarea");t.value=lastMsg;document.body.appendChild(t);t.select();try{document.execCommand("copy")}catch(_){}t.remove()}b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy order text",2000)};
const upi=()=>{const i=info();if(!i)return;location.href=`upi://pay?pa=${encodeURIComponent(SHOP.upi)}&pn=${encodeURIComponent(SHOP.name)}&am=${i.T}&cu=INR&tn=${encodeURIComponent("Order for "+i.n)}`};
document.addEventListener("click",ev=>{const t=ev.target,h=t.closest(".hs"),a=t.closest("[data-a]"),m=t.closest("[data-m]");
 if(h)openList(h.dataset.i);else if(t.closest("[data-l]"))like(t.closest("[data-l]").dataset.l);else if(a)chg(a.dataset.a,1);else if(m)chg(m.dataset.m,-1);
 else if(t.closest("#bar")||t.closest("[data-co]")){const l=$("#dlg");if(l.open)l.close();openCo()}
 else if(t.closest("[data-send]"))send();else if(t.closest("[data-copy]"))copyMsg(t.closest("[data-copy]"));else if(t.closest("[data-back]"))openCo();else if(t.closest("[data-new]")){cart.clear();lastForm=null;refresh();$("#co").close()}else if(t.closest("[data-upi]"))upi();
 else if(t.closest("[data-clr]")){cart.clear();refresh()}
 else if(t.closest("[data-x]")||t.tagName=="DIALOG")(t.closest("dialog")||t).close();
 const c=t.closest(".chips button");if(c)rain(c.dataset.r)});
document.addEventListener("change",ev=>{if(ev.target.name=="ty")coRender()});
refresh();loadLikes();
function rain(k){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const L=document.createElement("div"),C=["#ff5b72","#ffd23f","#5fb0ff","#7bd88f","#ff9a40","#d98cff","#fff"];L.className="rain";
 for(let i=0;i<70;i++){const q=document.createElement("i");q.className="p "+k;q.style.left=Math.random()*100+"vw";q.style.animationDuration=(1.6+Math.random()*1.6)+"s";q.style.animationDelay=Math.random()*1.2+"s";q.style.setProperty("--r",(Math.random()*720-360)+"deg");if(k=="spr")q.style.background=C[i%C.length];L.appendChild(q)}
 document.body.appendChild(L);setTimeout(()=>L.remove(),4400)}
</script></body></html>
